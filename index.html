const CURATOR_DB = Object.fromEntries(
  Object.entries(CURATOR_DB_RAW).map(([genre, list]) => [genre, [HHV_ENTRY, ...list]])
);

function generatePitch({ artistName, trackName, genre, mood, releaseDate, shortBio }) {
  return `Subject: New Release Submission – "${trackName}" by ${artistName}

Hi there,

I'm ${artistName}, an independent artist working in the ${genre} space. I'm reaching out to share my latest track "${trackName}", releasing on ${releaseDate || "[release date]"}.

${shortBio || `${artistName} creates music that blends raw emotion with atmospheric production.`}

"${trackName}" is a ${mood || "cinematic and emotionally resonant"} track that I think fits well with your playlist's aesthetic. It would be an honour to have it considered for a feature.

You can stream/preview here: [Insert Spotify/SoundCloud link]

I'm happy to provide any additional info. Thanks so much for your time and for the incredible work you do championing independent music.

Warm regards,
${artistName}`;
}

function generateWeeklyPlan(trackName) {
  return [
    { week: "Week 1 (4 weeks before release)", tasks: [
      "Upload track to SubmitHub & Groover for paid curator submissions",
      "Research 20–30 independent playlist curators in your genre",
      "Draft personalized pitches for top 10 targets",
      "Pitch to music blogs (Homegrown, Wild City, etc.)",
      "Announce pre-save campaign on Instagram Stories",
    ]},
    { week: "Week 2 (3 weeks before release)", tasks: [
      "Send first round of outreach emails to curators",
      "Submit to Spotify for Artists editorial pitching (at least 7 days before release)",
      "Reach out to 5 podcast hosts in your genre",
      "Create release countdown content for Instagram/Reels",
      "Send press release to 3 music journalists",
    ]},
    { week: "Week 3 (2 weeks before release)", tasks: [
      "Follow up on unanswered pitches from Week 2",
      "Send second round of outreach to new curators",
      "Share a 15-sec teaser clip on Reels/Shorts",
      "Engage with playlists that have featured similar artists",
      "DM fan accounts in your niche to build early buzz",
    ]},
    { week: "Week 4 (Release week)", tasks: [
      `Release day: Share "${trackName || "your track"}" everywhere`,
      "Post release announcement with Spotify link on all platforms",
      "Thank all curators who featured the track",
      "Run a Story poll: 'What's your fav lyric?'",
      "Post a behind-the-scenes Reel about making the track",
    ]},
    { week: "Week 5–6 (Post-release)", tasks: [
      "Analyze Spotify for Artists: saves, streams, playlist adds",
      "Re-pitch to curators who didn't respond initially",
      "Submit to monthly playlist roundups and blog features",
      "Repurpose track for Instagram Reels with trending audio",
      "Start planning next release while momentum is up",
    ]},
  ];
}
